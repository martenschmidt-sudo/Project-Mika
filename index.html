<title>Mika</title>
<meta name="description" content="A diary that supports you day to day with bulimia.">
<meta name="author" content="Marten Schmidt">
<meta name="copyright" content="© 2026 Marten Schmidt. All rights reserved.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mika">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#111816" media="(prefers-color-scheme: dark)">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 -apple-system,system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm phone column, sticky date header, bottom tab bar, full-screen sheets for entries */
:root{
  --bg:#EDF2F0; --surface:#FFFFFF; --surface-2:#E2EAE7; --line:#CFDAD6;
  --ink:#1D2B29; --muted:#5A6B67;
  --accent:#2F7568; --accent-soft:#D4E8E3; --on-accent:#FFFFFF;
  --urge:#6E5FA8; --urge-soft:#E6E1F5;
  --mood:#A0731F; --mood-soft:#F4E9D2;
  --sos:#B4475C; --sos-soft:#F6DEE3;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#1A2321; --surface-2:#22302D; --line:#2E3D3A;
  --ink:#E3ECE9; --muted:#97A9A4;
  --accent:#78C2B3; --accent-soft:#1F3833; --on-accent:#0E1E1A;
  --urge:#AFA3E6; --urge-soft:#2A2640;
  --mood:#E0B566; --mood-soft:#352B18;
  --sos:#EE8A9C; --sos-soft:#3D2027; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#1A2321; --surface-2:#22302D; --line:#2E3D3A;
  --ink:#E3ECE9; --muted:#97A9A4;
  --accent:#78C2B3; --accent-soft:#1F3833; --on-accent:#0E1E1A;
  --urge:#AFA3E6; --urge-soft:#2A2640;
  --mood:#E0B566; --mood-soft:#352B18;
  --sos:#EE8A9C; --sos-soft:#3D2027; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:1.9rem;line-height:1.15}
h2{font-size:1.35rem;line-height:1.2}
h3{font-size:1.05rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.875rem}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:8px}
header.top .title{flex:1;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.view{display:flex;flex-direction:column;gap:20px;padding-top:6px}

.banner{background:var(--surface-2);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.875rem}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qbtn{border:0;border-radius:var(--r);padding:14px 10px 12px;text-align:left;display:flex;flex-direction:column;gap:22px;min-height:104px}
.qbtn b{font-weight:600;font-size:.98rem;line-height:1.2}
.qbtn span{font-size:.75rem;opacity:.8}
.qbtn svg{width:22px;height:22px}
.q-meal{background:var(--accent-soft);color:var(--accent)}
.q-urge{background:var(--urge-soft);color:var(--urge)}
.q-mood{background:var(--mood-soft);color:var(--mood)}
.qbtn b,.qbtn span{color:var(--ink)}

.sosbar{display:flex;align-items:center;gap:12px;background:var(--sos-soft);border-radius:var(--r);padding:12px 14px;border:0;width:100%;text-align:left}
.sosbar .dot{width:36px;height:36px;border-radius:50%;background:var(--sos);color:var(--surface);display:grid;place-items:center;flex:none;font-weight:700}
.sosbar div{flex:1;min-width:0}

.rhythm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.slot{font-size:.72rem;padding:4px 8px;border-radius:99px;border:1px dashed var(--line);color:var(--muted)}
.slot.on{border:1px solid transparent;background:var(--accent-soft);color:var(--accent);font-weight:600}

.timeline{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:52px 14px 1fr;gap:0 10px;border:0;background:none;text-align:left;padding:0;width:100%}
.entry .time{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);padding-top:14px;text-align:right}
.entry .rail{position:relative;display:flex;justify-content:center}
.entry .rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.entry:first-child .rail::before{top:18px}
.entry:last-child .rail::before{bottom:calc(100% - 18px)}
.entry .pip{position:relative;margin-top:14px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg)}
.entry .card{background:var(--surface);border-radius:14px;padding:12px 14px;margin-block:4px;min-width:0;border:1px solid var(--line)}
.entry .card .k{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.entry .card p{margin:2px 0 0;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.ex{font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:2px}
.t-meal .pip{background:var(--accent)} .t-meal .k{color:var(--accent)}
.t-urge .pip{background:var(--urge)} .t-urge .k{color:var(--urge)}
.t-mood .pip{background:var(--mood)} .t-mood .k{color:var(--mood)}
.t-log .pip{background:var(--ink)} .t-log .k{color:var(--ink)}
.t-acute .pip{background:var(--urge)} .t-acute .k{color:var(--urge)}
.logbtn{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:var(--r);padding:16px;background:var(--ink);color:var(--bg);text-align:left}
.logbtn .ring{width:44px;height:44px;border-radius:50%;background:var(--bg);color:var(--ink);display:grid;place-items:center;flex:none}
.logbtn .ring svg{width:24px;height:24px}
.logbtn .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.logbtn b{font-size:1.1rem}
.logbtn .txt span{font-size:.8rem;opacity:.75}
.logbtn .chev{font-size:1.4rem;opacity:.6}
.voice{display:flex;align-items:center;gap:12px;width:100%;border:1px dashed var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;text-align:left;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.voice .mic{width:48px;height:48px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;flex:none}
.voice .mic svg{width:22px;height:22px}
.voice .vt{flex:1;min-width:0;display:flex;flex-direction:column}
.voice .vt span{font-size:.78rem;color:var(--muted)}
.voice .soon{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);flex:none}
.reveal{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;border:1px dashed var(--line);background:none;border-radius:12px;padding:12px;color:var(--muted);font-weight:600;font-size:.9rem}
.qnum{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);font-size:.75rem;font-weight:700;margin-right:6px;color:var(--ink)}
.heat{display:grid;grid-template-columns:5.2em repeat(5,1fr);gap:4px;margin-top:12px;font-size:.75rem;align-items:center}
.heat .h{text-align:center;color:var(--muted);font-size:.68rem}
.heat .rl{color:var(--muted)}
.heat .c{height:34px;border-radius:8px;display:grid;place-items:center;font-variant-numeric:tabular-nums;font-weight:600;background:var(--surface-2);color:var(--muted)}
.spark{width:100%;height:auto;display:block;margin-top:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cmp div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.cmp b{display:block;font-family:var(--display);font-weight:400;font-size:1.5rem;font-variant-numeric:tabular-nums}
.cmp span{font-size:.75rem;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--muted)}

.daynav{display:flex;align-items:center;gap:8px}
.daynav .d{flex:1;text-align:center;font-weight:600}

/* Verlauf */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;margin-top:12px}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0}
.bars{height:64px;width:100%;display:flex;flex-direction:column-reverse;gap:2px}
.bars i{display:block;height:9px;border-radius:3px;background:var(--accent)}
.bars i.ghost{background:var(--surface-2)}
.urgedot{width:8px;height:8px;border-radius:50%;background:var(--urge)}
.urgedot.none{background:transparent;border:1px solid var(--line)}
.col small{font-size:.62rem;color:var(--muted);font-variant-numeric:tabular-nums}
.col.today small{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.75rem;color:var(--muted)}
.rank{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rank div{display:grid;grid-template-columns:minmax(0,9em) 1fr 2em;gap:8px;align-items:center;font-size:.875rem}
.rank .bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.rank .bar i{display:block;height:100%;border-radius:4px}
.rank .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* Hilfe */
.breath{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 8px 8px}
.circle{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 50% 45%,var(--accent-soft),transparent 70%);display:grid;place-items:center;position:relative;max-width:100%}
.circle::before{content:"";position:absolute;inset:18px;border-radius:50%;background:var(--accent);opacity:.18;transform:scale(.6);transition:transform 4s ease-in-out}
.circle.in::before{transform:scale(1);transition-duration:4s}
.circle.out::before{transform:scale(.6);transition-duration:6s}
.circle span{position:relative;font-family:var(--display);font-size:1.25rem}
.timer{font-variant-numeric:tabular-nums;font-size:2rem;font-family:var(--display)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--sos);color:var(--surface)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.idea{font-family:var(--display);font-size:1.2rem;line-height:1.35;min-height:3.2em;margin:8px 0 12px}
.contact{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.contact:first-of-type{border-top:0}
.contact .num{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;user-select:all}
.contact .num a{color:inherit;text-decoration:none}
.contact .copy{grid-row:1 / span 2;grid-column:2}
textarea,input[type=text],input[type=datetime-local],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
textarea{min-height:80px;resize:vertical}
.note{font-size:.8rem;color:var(--muted)}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-inner{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-head h2{flex:1}
.field{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:.875rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scale{display:flex;align-items:center;gap:12px}
.scale input{flex:1;accent-color:var(--accent)}
.scale output{font-variant-numeric:tabular-nums;font-weight:700;width:2ch;text-align:right}
.scale-ends{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.save-bar{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.save-bar .wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.save-bar .btn{flex:1}
.kind{display:flex;gap:6px}
.kind button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;font-size:.875rem;font-weight:600}
.kind button[aria-pressed="true"]{border-color:transparent}
.gentle{background:var(--urge-soft);border-radius:12px;padding:12px 14px;font-size:.9rem}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs button{border:0;background:none;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button.sos[aria-current="page"]{color:var(--sos)}
/* Notfall-Knopf & Auswahlfenster */
.sosbtn{height:40px;padding:0 14px;border-radius:99px;border:0;background:var(--sos);color:var(--surface);font-weight:700;font-size:.85rem;letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px;flex:none}
.sosbtn svg{width:16px;height:16px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,18,16,.55);display:flex;align-items:flex-end;justify-content:center}
.dialog{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.dialog-head{display:flex;align-items:center;gap:10px}
.dialog-head h2{flex:1}
.callopt{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border-radius:16px;padding:14px 16px;text-decoration:none}
.callopt b{font-size:1.1rem}
.callopt .num{font-variant-numeric:tabular-nums;font-size:1.35rem;font-family:var(--display);user-select:all;overflow-wrap:anywhere}
.callopt .copy{grid-row:1 / span 2;grid-column:2}
.call-112{background:var(--sos);color:var(--surface)}
.call-112 .btn{background:rgba(255,255,255,.22);color:var(--surface)}
.call-person{background:var(--accent-soft);color:var(--ink)}
.callopt a{color:inherit;text-decoration:none}
/* Übungen */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;align-self:stretch}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ground{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.ground .big{font-family:var(--display);font-size:3rem;line-height:1;color:var(--accent)}
.ground .step{font-family:var(--display);font-size:1.2rem;line-height:1.35}
.ground .dots{display:flex;gap:6px}
.ground .dots i{width:8px;height:8px;border-radius:50%;background:var(--surface-2)}
.ground .dots i.on{background:var(--accent)}
.checkin{background:var(--accent-soft);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.checkin h2{font-size:1.3rem}
.checkin p{margin:0;color:var(--muted)}
.checkin .btnrow{margin-top:6px}
.switchrow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600;padding-block:4px;cursor:pointer}
.switchrow input,.ci-row input[type=checkbox]{appearance:none;-webkit-appearance:none;margin:0;flex:none;cursor:pointer}
.switchrow input{width:50px;height:30px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);position:relative;transition:background .2s}
.switchrow input::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switchrow input:checked{background:var(--accent);border-color:var(--accent)}
.switchrow input:checked::after{transform:translateX(20px)}
.ci-slots{display:flex;flex-direction:column}
.ci-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.ci-row input[type=checkbox]{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ci-row input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.ci-row input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.ci-row label{display:flex;flex-direction:column;min-width:0;cursor:pointer}
.ci-row input[type=time]{width:auto;min-width:6.5em;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px;font-variant-numeric:tabular-nums}
.ci-row.off label,.ci-row.off input[type=time]{opacity:.5}
.ci-push{display:flex;align-items:center;gap:12px;justify-content:space-between;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-top:4px}
.ci-push>span:first-child{display:flex;flex-direction:column;min-width:0}

c.bored.noplan": "Unter Übungen kannst du deinen eigenen Plan für schwere Momente aufschreiben.", "ac.bored.ideas": "Ideen", "ac.time.title": "Zeit gewinnen", "ac.time.text": "Verlass kurz die Küche oder den Raum.", "ac.time.pick": "Timer stellen", "ac.time.min": "{n} Min.", "ac.time.done": "Die Zeit ist um.", "ac.time.plus5": "+5 Minuten", "ac.time.action": "Was machst du in der Zwischenzeit?", "act.room": "Raum wechseln", "act.walk": "Kurz an die frische Luft", "act.shower": "Warm duschen", "act.call": "Jemanden anrufen", "act.music": "Musik", "act.drink": "Warmes Getränk", "act.write": "Aufschreiben", "act.hands": "Etwas für die Hände", "ac.check.title": "Wie stark ist es jetzt?", "ac.out.passed": "Die Welle ist abgeebbt", "ac.out.strong": "Noch stark", "ac.out.ate": "Ich habe gegessen", "ac.passed.title": "Du hast die Welle vorbeiziehen lassen.", "ac.passed.text": "Das hat Kraft gekostet. Dieser Moment steht jetzt in deinem Tagebuch.", "ac.finish": "Fertig", "ac.strong.title": "Es ist noch stark. Das ist okay.", "ac.strong.text": "Wellen kommen manchmal in Serien. Lass uns noch etwas Zeit gewinnen.", "ac.strong.more": "Noch {n} Minuten", "ac.strong.contact": "Kontaktperson schreiben", "ac.strong.eased": "Jetzt ist es abgeebbt", "ac.ate.title": "Wie fühlst du dich jetzt?", "ac.ate.text": "Es gibt keine richtige oder falsche Antwort.", "af.relieved": "erleichtert", "af.calmer": "ruhiger", "af.neutral": "neutral", "af.full": "zu voll / zu viel gegessen", "af.shame": "Scham / schlecht", "af.anxious": "ängstlich / unruhig", "af.compensate": "Drang, es auszugleichen", "ac.trig.title": "Was hat es ausgelöst? (optional)", "at.buildup": "Es hat sich über den Tag angestaut", "at.lastdrop": "Eine Kleinigkeit hat das Fass zum Überlaufen gebracht", "at.hungry": "Ich hatte lange nichts gegessen", "at.unknown": "Weiß nicht", "ac.trig.what": "Was war es?", "ac.optional": "optional", "ac.reply.title": "Danke, dass du es festhältst.", "ac.r.relieved": "Erleichterung ist verständlich. Das Essen hat dir geholfen, etwas Schweres auszuhalten. Magst du festhalten, was es so schwer gemacht hat?", "ac.r.full": "Sorg für deinen Körper: bequeme Kleidung, Wärme, etwas Warmes trinken, ausruhen. Nächste Mahlzeit ganz normal – nichts auslassen, sonst wird der nächste Drang stärker.", "ac.r.shame": "Eine Mitgefühls-Pause:", "ac.r.shame1": "Das ist gerade schwer.", "ac.r.shame2": "Andere kennen das auch.", "ac.r.shame3": "Ich darf freundlich zu mir sein.", "ac.r.lastdrop": "Oft ist es nicht die Kleinigkeit, sondern alles, was sich davor angesammelt hat.", "ac.r.builtup": "Was hatte sich angestaut?", "ac.r.compensate": "Das ist eine zweite Welle. Auch sie geht vorbei, ohne dass du etwas tun musst.", "ac.r.second": "Durch die zweite Welle", "ac.r.default": "Was auch immer du jetzt fühlst, ist okay. Nächste Mahlzeit ganz normal.", "ac.second.title": "Die zweite Welle", "ac.second.meal": "Nächste Mahlzeit ganz normal.", "ac.offer.title": "Soll ich dich durch die Welle begleiten?", "ac.offer.text": "Du hast einen starken Drang notiert. „Drang akut“ hilft dir direkt im Moment.", "ac.offer.yes": "Ja, bitte", "ac.offer.no": "Nein danke", "ac.hist.summary": "{n}× genutzt · {p}× ist die Welle abgeebbt", "ac.hist.avg": "Drang im Schnitt {a} → {b}", "ac.hist.feel": "Häufige Gefühle", "ac.hist.trig": "Häufige Auslöser", "ac.hist.empty": "Noch nicht genutzt. Wenn ein Drang kommt, begleitet dich „Drang akut“ hindurch.", "ac.hist.note": "Jede Welle, die vorbeigezogen ist, zählt.", "card.acute": "Drang akut", "ac.entry": "Drang {a} → {b} · {o}", "ac.o.passed": "abgeebbt", "ac.o.strong": "noch stark", "ac.o.ate": "gegessen", "ac.o.none": "vorzeitig beendet", "ac.detail.need": "Bedürfnis", "ac.detail.action": "In der Zwischenzeit", "ac.detail.timer": "Timer", "ac.detail.after": "Danach"});
Object.assign(T.sv,{"ac.title": "Akut sug", "ac.sub": "Jag följer dig genom vågen", "ac.resume.title": "Du började rida på en våg", "ac.resume.text": "Vill du fortsätta eller avsluta?", "ac.resume.go": "Fortsätt", "ac.resume.end": "Avsluta", "ac.end": "Avsluta", "ac.back": "Tillbaka", "ac.skip": "Hoppa över", "ac.next": "Nästa", "ac.step": "Steg {n} av 5", "ac.breathe.title": "Andas med mig", "ac.breathe.text": "Ungefär en minut. In i 4, ut i 6.", "ac.name.title": "Vad finns här just nu?", "ac.name.quote": "Ett sug är en känsla, inte en order. Det kommer och går som en våg.", "ac.urge": "Sug", "ac.anx": "Ångest", "ac.feel": "Känslor", "feel.exhausted": "utmattad", "ac.need.title": "Vad behöver du just nu?", "ac.need.text": "Välj det som passar bäst.", "need.hunger": "Mat", "need.lonely": "Närhet", "need.exhausted": "Vila", "need.stress": "Avlastning", "need.bored": "Sysselsättning", "ac.hunger.q": "När åt du senast?", "ac.hunger.lt2": "under 2 tim", "ac.hunger.2to4": "2–4 tim", "ac.hunger.gt4": "över 4 tim", "ac.hunger.tip": "Ät en vanlig måltid eller ett mellanmål nu – vid bordet, på en tallrik.", "ac.hunger.tip2": "Ett litet mellanmål kan hjälpa nu – vid bordet, på en tallrik.", "ac.hunger.ok": "Då är hunger troligen inte det viktigaste. Titta även på de andra behoven.", "ac.lonely.text": "Säg till någon – ett tryck räcker.", "ac.lonely.msg": "Har ett tungt ögonblick just nu, kan du skriva en stund?", "ac.lonely.sms": "Skicka som sms", "ac.lonely.wa": "Skicka via WhatsApp", "ac.lonely.none": "Ingen kontaktperson tillagd än. Du kan lägga till en senare i inställningarna.", "ac.rest.text": "Kanske behöver din kropp framför allt vila. Lägg dig en stund, håll dig varm, gå och lägg dig tidigare i kväll.", "ac.stress.text": "Skriv ner en sak som tynger dig just nu – eller lämna över den. Gå sedan ut en kort stund.", "ac.bored.plan": "Din plan", "ac.bored.noplan": "Under Övningar kan du skriva din egen plan för svåra stunder.", "ac.bored.ideas": "Idéer", "ac.time.title": "Vinn lite tid", "ac.time.text": "Lämna köket eller rummet en stund.", "ac.time.pick": "Ställ en timer", "ac.time.min": "{n} min", "ac.time.done": "Tiden är ute.", "ac.time.plus5": "+5 minuter", "ac.time.action": "Vad gör du under tiden?", "act.room": "Byt rum", "act.walk": "Kort tur ut i friska luften", "act.shower": "Varm dusch", "act.call": "Ring någon", "act.music": "Musik", "act.drink": "Varm dryck", "act.write": "Skriv ner det", "act.hands": "Något för händerna", "ac.check.title": "Hur starkt är det nu?", "ac.out.passed": "Vågen har ebbat ut", "ac.out.strong": "Fortfarande starkt", "ac.out.ate": "Jag har ätit", "ac.passed.title": "Du lät vågen passera.", "ac.passed.text": "Det krävde styrka. Det här ögonblicket finns nu i din dagbok.", "ac.finish": "Klar", "ac.strong.title": "Det är fortfarande starkt. Det är okej.", "ac.strong.text": "Vågor kommer ibland i serier. Låt oss vinna lite mer tid.", "ac.strong.more": "{n} minuter till", "ac.strong.contact": "Skriv till kontaktpersonen", "ac.strong.eased": "Nu har det ebbat ut", "ac.ate.title": "Hur känner du dig nu?", "ac.ate.text": "Det finns inget rätt eller fel svar.", "af.relieved": "lättad", "af.calmer": "lugnare", "af.neutral": "neutral", "af.full": "för mätt / åt för mycket", "af.shame": "skam / dåligt", "af.anxious": "orolig / rastlös", "af.compensate": "sug att kompensera", "ac.trig.title": "Vad utlöste det? (valfritt)", "at.buildup": "Det byggdes upp under dagen", "at.lastdrop": "En liten sak fick bägaren att rinna över", "at.hungry": "Jag hade inte ätit på länge", "at.unknown": "Vet inte", "ac.trig.what": "Vad var det?", "ac.optional": "valfritt", "ac.reply.title": "Tack för att du skriver ner det.", "ac.r.relieved": "Lättnad är förståelig. Maten hjälpte dig att stå ut med något tungt. Vill du skriva ner vad som gjorde det så tungt?", "ac.r.full": "Ta hand om din kropp: bekväma kläder, värme, något varmt att dricka, vila. Nästa måltid helt som vanligt – hoppa inte över något, annars blir nästa sug stark let lang='en';
function t(k,vars){let s=T[lang]&&T[lang][k];if(s==null)s=T.en[k];if(s==null)return k;
  if(typeof s==='string'){s=s.replace(/\{app\}/g,APP_NAME);if(vars)s=s.replace(/\{(\w+)\}/g,(m,v)=>vars[v]??'')}return s}

let state={entries:[],plan:'',contactName:'',contactNumber:'',seeded:false,lang:'en',country:null,welcomed:false,fb:{rate:0,good:'',bad:'',miss:''}};
let storageOk=true;
function guessCountry(){const l=(navigator.language||'').toLowerCase();
  if(l.startsWith('de'))return 'DE';if(l.startsWith('sv'))return 'SE';if(l.startsWith('es'))return 'ES';if(l.startsWith('fr'))return 'FR';if(l==='en-gb')return 'UK';return 'OTHER'}
function load(){
  let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){storageOk=false}
  if(raw){try{state=Object.assign(state,JSON.parse(raw))}catch(e){}}
  if(!state.fb)state.fb={rate:0,good:'',bad:'',miss:''};
  if(state.person&&!state.contactName){state.contactName=state.person;delete state.person}
  if(!raw)state.schema=2;
  if(!state.schema||state.schema<2)migrate();
  if(!state.seeded){state.entries=examples();state.seeded=true;state.seededLog=true}
  else if(!state.seededLog){if(state.entries.some(e=>e.example))state.entries.push(...logExamples());state.seededLog=true}
  if(!state.country)state.country=guessCountry();
  if(!state.seededAcute){if(state.entries.some(e=>e.example))state.entries.push(...acuteExamples());state.seededAcute=true}
  if(!state.checkins)state.checkins={on:true,slots:[{id:'midday',time:'13:00',on:true},{id:'afternoon',time:'17:00',on:true},{id:'evening',time:'22:00',on:true}],dismissed:{}};
  if(!T[state.lang])state.lang='en';
  lang=state.lang;save();
}
function migrate(){
  const k=v=>DE_KEYS[v]||v; const arr=a=>(a||[]).map(k);
  const hadEx=state.entries.some(e=>e.example);
  state.entries=state.entries.filter(e=>!e.example).map(e=>{e=Object.assign({},e);
    ['fBefore','fAfter','feelings','kinds','triggers','helped'].forEach(f=>{if(e[f])e[f]=arr(e[f])});
    if(e.slot)e.slot=k(e.slot);if(e.company)e.company=k(e.company);return e});
  if(hadEx){state.entries.push(...examples());state.seededLog=true}
  if(!state.lang||state.schema==null)state.lang='en';
  state.schema=2;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOk=false}}

  if(state.entries.some(e=>e.type==='log'&&!e.example&&e.ts>=st.getTime()))return null;

function acuteHistory(recent){

  const passed=L.filter(e=>e.outcome==='passed').length;
  const both=L.filter(e=>e.urgeBefore!=null&&e.urgeAfter!=null);
  const avg=a=>(a.reduce((s,x)=>s+x,0)/a.length).toLocaleString(loc(),{maximumFractionDigits:1});
  const cnt=arr=>{const m={};arr.forEach(x=>m[x]=(m[x]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,4)};
  const fe=cnt(L.flatMap(e=>e.feelings||[])),tr=cnt(L.map(e=>e.trig).filter(Boolean));
  return `<section class="panel acute-hist"><h3>${esc(t('card.acute'))}</h3>
    <p class="ac-sum">${esc(t('ac.hist.summary',{n:L.length,p:passed}))}</p>
    ${both.length?`<p class="small muted" style="margin:2px 0 0">${esc(t('ac.hist.avg',{a:avg(both.map(e=>e.urgeBefore)),b:avg(both.map(e=>e.urgeAfter))}))}</p>`:''}
    ${fe.length?`<p class="label" style="margin:12px 0 4px">${esc(t('ac.hist.feel'))}</p><div class="tags">${fe.map(([k,n])=>`<span class="tag">${esc(o('feel',k))} ×${n}</span>`).join('')}</div>`:''}
    ${tr.length?`<p class="label" style="margin:12px 0 4px">${esc(t('ac.hist.trig'))}</p><div class="tags">${tr.map(([k,n])=>`<span class="tag">${esc(t('at.'+k))} ×${n}</span>`).join('')}</div>`:''}
    <p class="note" style="margin:10px 0 0">${esc(t('ac.hist.note'))}</p></section>`;
}

const JSPDF_URL='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';

function buildPdf(jspdf,days,notes){

      lines.push(t('pdf.anx',{a:fmt1(logs.filter(l=>l.urge===true).map(l=>l.anxLevel||0)),b:fmt1(logs.filter(l=>l.urge===false).map(l=>l.anxLevel||0))}))}
    lines.forEach(l=>text('•  '+l,10.5,'normal',C.ink,0));gap(2);
    const cnt=arr=>{const m={};arr.forEach(x=>m[x]=(m[x]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,6)};

function renderGround(){
  const g=$('#ground');if(!g)return;const steps=t('ground.steps');

    $('#gMood').onclick=()=>openSheet({type:'mood'});$('#gAgain').onclick=()=>{groundIdx=0;renderGround()};return}
  const [what,tip]=steps[groundIdx];const n=5-groundIdx;
  g.innerHTML=`<div class="dots">${steps.map((_,i)=>`<i class="${i<=groundIdx?'on':''}"></i>`).join('')}</div>
    <div style="display:flex;gap:14px;align-items:baseline"><span class="big">${n}</span><span class="step">${what}</span></div>
    <p class="small muted" style="margin:0">${esc(tip)}</p>
    <div class="btnrow"><button class="btn" id="gNext">${esc(t(groundIdx===steps.length-1?'ground.finish':'ground.next'))}</button>${groundIdx>0?`<button class="btn ghost" id="gBack">${esc(t('ground.back'))}</button>`:''}</div>`;
  $('#gNext').onclick=()=>{groundIdx++;renderGround()};const bk=$('#gBack');if(bk)bk.onclick=()=>{groundIdx--;renderGround()};
}
let remaining=900,breathTimer=null,phaseTimer=null,running=false;
function fmtRemain(){return String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')}
function toggleBreath(){if(running){stopBreath();$('#startB').textContent=t('btn.resume');return}
  running=true;$('#startB').textContent=t('btn.pause');
  breathTimer=setInterval(()=>{remaining--;const el=$('#timer');if(!el)return stopBreath();el.textContent=fmtRemain();
    if(remaining<=0){stopBreath();$('#cue').textContent=t('cue.done');$('#startB').textContent=t('btn.again');remaining=900;toast(t('toast.wave'))}},1000);
  let i=0;const ph=BREATH[breathMode];
  const phase=()=>{const c=$('#circle');if(!c||!running)return;const [cls,key,sec]=ph[i%ph.length];
    c.style.transitionDuration=sec+'s';c.className='circle '+cls;$('#cue').textContent=t(key);phaseTimer=setTimeout(phase,sec*1000);i++};phase()}
function stopBreath(){running=false;clearInterval(breathTimer);clearTimeout(phaseTimer);const c=$('#circle');if(c)c.className='circle'}

    ${scale('intensity',t('f.howStrong'),e.intensity,t('mood.lo'),t('mood.hi'))}`}
  const title=t('sheet.'+ty);
  sheet.dataset.kind='entry';
  sheet.innerHTML=`<div class="sheet-inner">
    <div class="sheet-head"><h2>${esc(isNew?title:t('sheet.edit',{t:title}))}</h2><button class="iconbtn" id="closeS" aria-label="${esc(t('close'))}">${ICON.x}</button></div>
    <div class="field"><label class="label" for="ts">${esc(t('f.time'))}</label><input type="datetime-local" id="ts" value="${toLocalInput(e.ts||Date.now())}"></div>
    ${form}
    <div class="field"><label class="label" for="note">${esc(t('f.note'))}</label><textarea id="note" placeholder="${esc(t('f.note.ph'))}">${esc(txt(e.note))}</textarea></div>
    ${isNew?'':`<div class="btnrow"><button class="btn ghost" id="del" style="color:var(--sos)">${esc(t('entry.del'))}</button></div><div id="delC" class="banner" hidden><span>${esc(t('entry.del.q'))}</span><span class="btnrow"><button class="btn danger" id="delY">${esc(t('del'))}</button><button class="btn ghost" id="delN">${esc(t('cancel'))}</button></span></div>`}
  </div>
  <div class="save-bar"><div class="wrap"><button class="btn" id="saveS">${esc(t('save'))}</button></div></div>`;
  sheet.hidden=false;document.body.style.overflow='hidden';sheet.scrollTop=0;
  sheet.querySelectorAll('.chip').forEach(c=>c.onclick=()=>c.setAttribute('aria-pressed',c.getAttribute('aria-pressed')!=='true'));
  const paint=b=>{b.style.background='var(--ink)';b.style.color='var(--bg)'};
  sheet.querySelectorAll('[data-single]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    g.querySelectorAll('button').forEach(x=>{x.setAttribute('aria-pressed','false');x.style.background='';x.style.color=''});
    b.setAttribute('aria-pressed','true');paint(b);
    if(g.dataset.single==='outcome')$('#gentle').hidden=!(b.dataset.v==='happened'||b.dataset.v==='partly');
    const w=$('#'+g.dataset.single+'Wrap');if(w)w.hidden=b.dataset.v!=='ja';
    if(g.dataset.single==='purged')$('#gentleLog').hidden=b.dataset.v!=='ja'}));
  sheet.querySelectorAll('[data-single] button[aria-pressed="true"]').forEach(paint);
  sheet.querySelectorAll('input[type=range]').forEach(r=>r.oninput=()=>{$('#'+r.id+'o').textContent=r.value});
  $('#closeS').onclick=()=>closeSheet();
  const vb=$('#voiceBtn');if(vb)vb.onclick=()=>toast(t('voice.toast'));
  const del=$('#del');if(del){del.onclick=()=>$('#delC').hidden=false;$('#delN').onclick=()=>$('#delC').hidden=true;
    $('#delY').onclick=()=>{state.entries=state.entries.filter(x=>x.id!==e.id);save();closeSheet();toast(t('entry.deleted'))}}
  $('#saveS').onclick=()=>{
    const chips=g=>[...sheet.querySelectorAll(`[data-group="${g}"] .chip[aria-pressed="true"]`)].map(c=>c.dataset.k);
    const one=g=>{const b=sheet.querySelector(`[data-single="${g}"] button[aria-pressed="true"]`);return b?b.dataset.v:null};
    const v=id=>{const el=$('#'+id);return el?el.value:''};
    const b3=g=>{const x=one(g);return x==='ja'?true:x==='nein'?false:null};
    const rec={id:e.id||uid(),type:ty,ts:fromLocalInput(v('ts'))||Date.now(),note:v('note').trim()};
    if(e.example&&rec.note===txt(e.note))rec.note=e.note;
    if(ty==='log'){const r={purged:b3('purged'),urge:b3('urge'),anxiety:b3('anxiety'),feelings:chips('feelings')};
      if(r.purged===null&&r.urge===null&&r.anxiety===null&&!r.feelings.length){toast(t('need.one'));return}
      r.urgeLevel=r.urge?+v('urgeLevel'):0;r.anxLevel=r.anxiety?+v('anxLevel'):0;Object.assign(rec,r)}
    else if(ty==='meal'){Object.assign(rec,{slot:v('slot'),what:v('what').trim(),where:v('where').trim(),company:one('company'),hunger:+v('hunger'),full:+v('full'),fBefore:chips('fBefore'),fAfter:chips('fAfter')});
      if(e.example){if(rec.what===txt(e.what))rec.what=e.what;if(rec.where===txt(e.where))rec.where=e.where}}
    else if(ty==='urge'){if(!chips('kinds').length){toast(t('need.kind'));return}
      Object.assign(rec,{kinds:chips('kinds'),intensity:+v('intensity'),triggers:chips('triggers'),helped:chips('helped'),outcome:one('outcome')||'passed'})}
    else{if(!chips('feelings').length){toast(t('need.feel'));return}Object.assign(rec,{feelings:chips('feelings'),intensity:+v('intensity')})}
    if(e.example)rec.example=true;
    const i=state.entries.findIndex(x=>x.id===rec.id);if(i>=0)state.entries[i]=rec;else state.entries.push(rec);
    save();viewDay=rec.ts;closeSheet();
    toast(ty==='urge'&&rec.outcome==='passed'?t('saved.wave'):t('saved'));
    const lvl=ty==='urge'?rec.intensity:(ty==='log'&&rec.urge)?rec.urgeLevel:0;
    if(isNew&&lvl>=5&&!(ty==='urge'&&rec.outcome==='passed'))setTimeout(()=>offerAcute(lvl),350);
  };
}
function closeSheet(keepTab){sheet.hidden=true;sheet.innerHTML='';sheet.dataset.kind='';document.body.style.overflow='';if(!keepTab)tab='heute';render()}

load();
const h0=(location.hash||'').slice(1);if(['heute','verlauf','uebungen'].includes(h0))tab=h0;
acuteFinalizeStale();
render();
function showWelcome(){let w=document.querySelector('.welcome');if(!w){w=document.createElement('div');w.className='welcome';w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');document.body.appendChild(w)}
  w.innerHTML=`<div class="in"><div class="langs" role="group" aria-label="${esc(t('lang.title'))}">${LANGS.map(([k,n])=>`<button data-wl="${k}" aria-pressed="${k===lang}" lang="${k}">${esc(n)}</button>`).join('')}</div>
  <div class="label">${esc(t('w.label'))}</div><h1>${esc(t('w.title'))}</h1>
  <p class="muted" style="margin:0">${esc(t('w.intro'))}</p>
  <ul>
   <li><span class="ic" style="background:var(--mood-soft);color:var(--mood)">T</span><span><b>${esc(t('w.1t'))}</b><span class="small muted">${esc(t('w.1'))}</span></span></li>
   <li><span class="ic" style="background:var(--accent-soft);color:var(--accent)">✓</span><span><b>${esc(t('w.2t'))}</b><span class="small muted">${esc(t('w.2'))}</span></span></li>
   <li><span class="ic" style="background:var(--urge-soft);color:var(--urge)">i</span><span><b>${esc(t('w.3t'))}</b><span class="small muted">${esc(t('w.3'))}</span></span></li>
   <li><span class="ic" style="background:var(--sos);color:var(--surface)">!</span><span><b>${esc(t('w.4t'))}</b><span class="small muted">${esc(t('w.4'))}</span></span></li>
  </ul>
  <p class="small muted" style="margin:0">${esc(t('w.ex'))}</p>
  <button class="btn" id="welcomeGo">${esc(t('w.go'))}</button></div>`;
  document.body.style.overflow='hidden';
  w.querySelectorAll('[data-wl]').forEach(b=>b.onclick=()=>{setLang(b.dataset.wl);showWelcome()});
  w.querySelector('#welcomeGo').onclick=()=>{state.welcomed=true;save();w.remove();document.body.style.overflow=''};}
if(!state.welcomed)showWelcome();
if(h0==='drang')openAcute();

})();
</script>
</body>
